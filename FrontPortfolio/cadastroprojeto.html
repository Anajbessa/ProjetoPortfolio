<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Portfólios - Login</title>
    <link rel="stylesheet" href="style2.css">
   
</head>
<main>

        <h1>CADASTRO PROJETO</h1>
        <form>
            <div class="inputGroup"> <label for="name">Título do Projeto:</label>
                <div class="input-item"><i class="fa-solid fa-user"></i>
                    <input id="name" type="text">
                </div>
            </div>
            <div class="inputGroup"><label for="phone">Descrição do Projeto : </label>
                <div class="input-item"><i class="fa-solid fa-phone"></i> <input id="phone" type="text" />
                </div>
            </div>
            <div class="inputGroup"> <label for="email">Link:</label>
                <div class="input-item"><i class="fa-regular fa-envelope"></i>
                    <input id="email" type="text">
                </div>
            </div>
            <div class="inputGroup"> <label for="cpf">Imagens e vídeos:</label>
                <div class="input-item"><i class="fa-solid fa-folder"></i>
                    <input id="cpf" type="text">
                </div>
            </div>


            <button class="btn-cadastrocliente"><a href="listagem_projeto.html">CADASTRE</a></button>
        </form>

    </main>
