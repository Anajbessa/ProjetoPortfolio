<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Portfólios - Login</title>
    <link rel="stylesheet" href="style.css">
   
</head>

<body>
    <main class="pagina-login">

        <section class="lado-esquerdo">
            <div class="conteudo-esquerdo">
                <h1>Gerenciador de<br>Portfólios</h1>

                <p>
                    Organize, gerencie e acompanhe
                    seus projetos em um só lugar.
                </p>
            </div>
        </section>

        <section class="lado-direito">

            <section class="login-container">
                <div class="cabecalho-login">
                    <h2>Bem-vindo!</h2>
                    <p>Entre na sua conta para continuar.</p>
                </div>

                <form>
                    <div class="campo">
                        <label for="usuario">Usuário</label>
                        <input type="text" id="usuario" placeholder="Digite seu usuário">
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Digite sua senha">
                    </div>

                    <button class="btn-login"> <a href="Menu.html">Entrar</a></button>
                </form>
            </section>
        </section>
    </main>
</body>
</html>
